<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Grochu's tracker</title>
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grochu's tracker">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body>
<section class="auth" id="auth" hidden>
  <div class="auth-card">
    <div class="auth-brand"><img src="icons/icon-192.png" alt="" width="56" height="56"><h1>Grochu's tracker</h1></div>
    <nav class="vtabs auth-tabs" role="tablist" aria-label="Konto">
      <button class="vtab" role="tab" data-auth="in" aria-selected="true">Zaloguj się</button>
      <button class="vtab" role="tab" data-auth="up" aria-selected="false">Załóż konto</button>
    </nav>
    <form id="auth-form" class="lform" novalidate>
      <div class="field"><label for="a-email">E-mail</label><input id="a-email" type="email" required autocomplete="email" inputmode="email" placeholder="ty@przyklad.pl"></div>
      <div class="field"><label for="a-pass">Hasło</label><input id="a-pass" type="password" required minlength="6" autocomplete="current-password" placeholder="min. 6 znaków"></div>
      <div class="field" id="a-pass2-row" hidden><label for="a-pass2">Powtórz hasło</label><input id="a-pass2" type="password" minlength="6" autocomplete="new-password"></div>
      <p class="auth-err" id="auth-err" role="alert" hidden></p>
      <button class="primary" type="submit" id="a-submit">Zaloguj się</button>
    </form>
  </div>
</section>

<main class="wrap" id="app-main">
  <header class="top">
    <div>
      <div class="eyebrow" id="week-label"></div>
      <div class="o-hero"><b id="week-pct">0%</b><span id="today-label"></span></div>
    </div>
    <div class="actions">
      <div class="weeknav">
        <button id="this-week">Dziś</button>
      </div>
      <button class="add" id="add-habit"><b>+</b>Nawyk</button>
    </div>
  </header>

  <nav class="vtabs" role="tablist" aria-label="Widok">
    <button class="vtab" role="tab" data-view="week" aria-selected="true">Tydzień</button>
    <button class="vtab" role="tab" data-view="calendar" aria-selected="false">Kalendarz</button>
  </nav>

  <section id="view-week">
    <div class="o-days" id="day-head"></div>
    <div class="day-note" id="day-note" hidden></div>
    <div class="o-list" id="list"></div>
  </section>
  <section id="view-calendar" hidden></section>
  <p class="empty" id="empty" hidden></p>
  <footer class="acct-foot" id="acct-foot" hidden><span id="acct-email"></span><button id="logout">Wyloguj</button></footer>
</main>

<div id="overlay"></div>
<script src="js/cloud.js?v=5"></script>
<script src="js/app.js?v=5"></script>
</body>
</html>
