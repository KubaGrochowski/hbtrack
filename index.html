<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Tygodnik</title>
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tygodnik">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="week-label"></div>
      <div class="o-hero"><b id="week-pct">0%</b><span id="today-label"></span></div>
    </div>
    <div class="actions">
      <div class="weeknav">
        <button id="this-week">Dziś</button>
      </div>
      <button class="add" id="add-habit"><b>+</b>Nawyk</button>
      <button class="icon" id="menu-btn" aria-label="Więcej">⋯</button>
    </div>
  </header>

  <nav class="vtabs" role="tablist" aria-label="Widok">
    <button class="vtab" role="tab" data-view="week" aria-selected="true">Tydzień</button>
    <button class="vtab" role="tab" data-view="calendar" aria-selected="false">Kalendarz</button>
  </nav>

  <section id="view-week">
    <div class="o-days" id="day-head"></div>
    <div class="day-note" id="day-note" hidden></div>
    <div class="o-list" id="list"></div>
  </section>
  <section id="view-calendar" hidden></section>
  <p class="empty" id="empty" hidden></p>
</main>

<div id="overlay"></div>
<script src="js/app.js"></script>
</body>
</html>
